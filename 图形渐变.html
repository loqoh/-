<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1c22;
        }
        .stage {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding: 32px;
        }
        .cube{
            width:170px;
            height:170px;
            display: flex;
            justify-content: center;
            align-items: center;

            color: transparent;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            user-select: none;

            transition:transform 0.3s ease,box-shadow 0.3s ease,color 0.3s ease;
        }
        .cube:hover{
            transform: translateY(-10px)scale(1.05);
            box-shadow: 0 0 24px rgba(255,255,255,0.35);
            color: #ffffff;
        }
        .c1{
            border-radius: 0%;
            background: linear-gradient(135deg, #ff9a56, #ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, 0.35);
            
        }
        .c2{
            border-radius: 16px;
            background: linear-gradient(135deg,#ff7a45,#ff4d4d);
            box-shadow: 0 10px 24px rgba(46,229,157,0.35);
           
        }
        .c3{
            border-radius: 20px;
            background: linear-gradient(135deg,#a18cd1,#8b6fc9);
            box-shadow: 0 10px 24px rgba(161,140,209,0.35);
            
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#ffd66b,#ffb347);
            box-shadow: 0 10px 24px rgba(255,179,71,0.4);
        }
        .c5{
            border-radius: 8px;
            background: linear-gradient(135deg,#4a8b7a,#3a6e61);
            box-shadow: 0 10px 24px rgba(74,139,122,0.35)
        }
        .c6{
            border-radius: 50%;
            background  : linear-gradient(135deg,#c4a0d8,#a87fc0);
            box-shadow: 0 10px 24px rgba(168,127,192,0.4)
        }
        
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1">hover</div>
        <div class="cube c2">hover</div>
        <div class="cube c3">hover</div>
        <div class="cube c4">hover</div>
        <div class="cube c5">hover</div>
        <div class="cube c6">hover</div>
    </div>
</body>
</html>
