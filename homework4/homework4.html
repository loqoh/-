<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式数据看板</title>
    <style>

        :root {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --border-color: #e0e0e0;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --card-bg: #16213e;
            --primary-color: #e94560;
            --border-color: #0f3460;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden; 
        }

        .layout-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .header h1 {
            font-size: 1.2rem;
        }

        .theme-toggle {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .sidebar {
            background-color: var(--card-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar ul {
            list-style: none;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .main-content {
            flex: 1;
            padding: 1rem;
        }

        .main-content h2 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card-title {
            font-size: 0.9rem;
            color: #888;
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
        }

        @media (min-width: 768px) {
            .layout-container {
                flex-direction: row;
            }
            .sidebar {
                width: 200px;
                border-bottom: none;
                border-right: 1px solid var(--border-color);
            }
            .sidebar ul {
                flex-direction: column;
            }
            .main-content {
                padding: 2rem;
            }
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .sidebar {
                width: 240px;
            }
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .icon {
            width: 24px;
            height: 24px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="layout-container">
        <aside class="sidebar">
            <h2>菜单导航</h2>
            <ul>
                <li>总览面板</li>
                <li>数据监控</li>
                <li>系统设置</li>
            </ul>
        </aside>

        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h1>核心数据看板</h1>
                <button class="theme-toggle" id="themeBtn">切换深/浅色</button>
            </header>

            <section>
                <div class="card-grid" id="dataGrid">
                </div>
            </section>
        </main>
    </div>

    <script>
        const dashboardData = [
            { title: '总访问量', value: '128,430', icon: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z' },
            { title: '活跃用户', value: '8,421', icon: 'M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z' },
            { title: '销售额', value: '¥ 45,200', icon: 'M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z' },
            { title: '转化率', value: '3.24%', icon: 'M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z' },
            { title: '客单价', value: '¥ 156.8', icon: 'M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z' },
            { title: '退货率', value: '0.85%', icon: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z' }
        ];

        const gridContainer = document.getElementById('dataGrid'); 
        
        dashboardData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="card-title">${item.title}</span>
                    <!-- 7. 内联 SVG 图标，继承颜色 -->
                    <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="${item.icon}"/>
                    </svg>
                </div>
                <div class="card-value">${item.value}</div>
            `;
            gridContainer.appendChild(card);
        });

        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        });
    </script>
</body>
</html>
